name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify formatting
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need gofmt:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start docker compose stack
        run: docker compose up -d --build postgres app frontend

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Wait for frontend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1

      - name: Run Playwright UI tests against compose
        working-directory: frontend
        env:
          PLAYWRIGHT_USE_EXTERNAL_SERVER: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          E2E_USE_LIVE_BACKEND: "true"
          E2E_API_BASE: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASSWORD: admin123
        run: npm run test:e2e

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs app frontend

      - name: Tear down docker compose
        if: always()
        run: docker compose down -v
